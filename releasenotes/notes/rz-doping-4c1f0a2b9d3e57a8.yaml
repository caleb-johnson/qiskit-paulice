---
features:
  - |
    Added the new :meth:`qiskit_paulice.CheckedCircuit.dope` method, which dopes the circuit
    with irreducible ``RZ`` rotations at sites selected as in
    `arXiv:2607.25941 <https://arxiv.org/abs/2607.25941>`__, Sec. S1.3, preserving its
    spacetime code. The doped wires are recorded in the new
    :attr:`~qiskit_paulice.CheckedCircuit.doped_wires` as :class:`qiskit_paulice.Wire`
    instances.
